<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Task Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <h1>My Task Tracker</h1>
    
    <!-- Row to add a task -->
    <div class="addrow">
      <input id="title" placeholder="Add a task…" />
      <button id="add">Add</button>
    </div>

    <!-- Filter Buttons -->
    <div id="filters">
      <button data-filter="all">All</button>
      <button data-filter="todo">Todo</button>
      <button data-filter="in-progress">In-Progress</button>
      <button data-filter="done">Done</button>
    </div>

    <!-- Task List Container -->
    <ul id="list"></ul>
  </div>

  <!-- Note: Load app.js, NOT app.ts -->
  <script type="module" src="app.js"></script>
</body>
</html>
